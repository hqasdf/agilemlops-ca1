services:
  mlflow:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
      MLFLOW_ALLOWED_HOSTS: localhost:*,127.0.0.1:*
    volumes:
      - ./mlflow-data:/mlflow
